name: Harmonic Lightwaves
description: >-
  Harmonic Lightwaves (now Harmonic Inc, NASDAQ: HLIT) is a pure-play broadband and video-delivery
  technology company headquartered in San Jose, California, founded in 1988 as Harmonic Lightwaves.
  It builds virtualized broadband access (the cOS platform, Distributed Access Architecture nodes,
  and fiber-to-the-x solutions) and cloud-native video streaming and processing (the VOS platform and
  VOS360 SaaS). Harmonic exposes a VOS REST API for media management, packaging, DRM, live event and
  linear-TV workflows, publishes first-party client-side ad-tracking SDKs for iOS, Android and Roku on
  GitHub, and maintains a technical documentation library. Its developer surface is largely
  operator- and customer-facing rather than a self-service public developer program.
